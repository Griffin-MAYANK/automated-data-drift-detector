name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test package and validate Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package and test dependencies
        run: python -m pip install ".[test]"

      - name: Run test suite
        run: python -m pytest -q

      - name: Build Docker image
        run: docker build -t "drift-detector:${{ github.sha }}" .

      - name: Verify Docker CLI help
        run: docker run --rm "drift-detector:${{ github.sha }}" --help

      - name: Verify Docker runtime user and contents
        shell: bash
        run: |
          docker run --rm \
            --entrypoint sh \
            "drift-detector:${{ github.sha }}" \
            -c '
              set -eu
              test "$(id -u)" -ne 0
              test -d /app/data
              test -d /app/reports
              test ! -e "/app/data/Online Retail.xlsx"
              test ! -e /app/reports/final_drift_report.csv
              test ! -e /app/reports/final_drift_report.json
              id
            '